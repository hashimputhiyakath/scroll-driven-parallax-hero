<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero Animation Practice</title>

    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="scene">
          <img class="layer sky" src="./assets/images/sky.webp" alt="" />
          <img class="layer earth" src="./assets/images/earth.webp" alt="" />
          <img class="layer moonscape" src="./assets/images/moonscape.webp" alt="" />
          <h1 class="hero-title">EARTHRISE</h1>
          <img class="layer frame" src="./assets/images/frame.webp" alt="" />
          <img class="layer astronaut" src="./assets/images/astronaut.webp" alt="" />
          <img class="layer ground" src="./assets/images/ground.webp" alt="" />
        </div>
        <div class="dust-veil">
          <canvas class="dust-particles" aria-hidden="true"></canvas>
          <p>Scroll to clear the dust ↓</p>
        </div>
      </section>

      <section class="next-section">
        <h2>After the Earthrise</h2>
        <p>This section gives us somewhere to scroll.</p>
      </section>
    </main>
  </body>
</html>
